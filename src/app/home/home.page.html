<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registro de Pedidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
    <ion-list>
      <!-- Nombre del Cliente -->
      <ion-item>
        <ion-input 
          label="Nombre del Cliente" 
          labelPlacement="floating" 
          formControlName="clientName" 
          placeholder="Nombre y apellido">
        </ion-input>
      </ion-item>
      <div class="error-text" *ngIf="orderForm.get('clientName')?.touched && orderForm.get('clientName')?.invalid">
        <small *ngIf="orderForm.get('clientName')?.errors?.['required']">El nombre es requerido.</small>
        <small *ngIf="orderForm.get('clientName')?.errors?.['pattern']">Solo se permiten letras.</small>
      </div>

      <!-- Dirección -->
      <ion-item>
        <ion-input 
          label="Dirección" 
          labelPlacement="floating" 
          formControlName="address" 
          placeholder="Mínimo 10 caracteres">
        </ion-input>
      </ion-item>
      <div class="error-text" *ngIf="orderForm.get('address')?.touched && orderForm.get('address')?.invalid">
        <small *ngIf="orderForm.get('address')?.errors?.['required']">La dirección es requerida.</small>
        <small *ngIf="orderForm.get('address')?.errors?.['minlength']">La dirección debe tener mínimo 10 caracteres.</small>
      </div>

      <!-- Cantidad de Productos -->
      <ion-item>
        <ion-input 
          type="number"
          label="Cantidad de productos" 
          labelPlacement="floating" 
          formControlName="quantity" 
          placeholder="Cantidad">
        </ion-input>
      </ion-item>
      <div class="error-text" *ngIf="orderForm.get('quantity')?.touched && orderForm.get('quantity')?.invalid">
        <small *ngIf="orderForm.get('quantity')?.errors?.['required']">La cantidad es requerida.</small>
        <small *ngIf="orderForm.get('quantity')?.errors?.['min']">La cantidad mínima es 1.</small>
      </div>

      <!-- Método de Pago -->
      <ion-item>
        <ion-select 
          label="Método de pago" 
          labelPlacement="floating" 
          formControlName="paymentMethod" 
          placeholder="Selecciona uno">
          <ion-select-option value="efectivo">Efectivo</ion-select-option>
          <ion-select-option value="tarjeta">Tarjeta</ion-select-option>
          <ion-select-option value="transferencia">Transferencia</ion-select-option>
        </ion-select>
      </ion-item>
      <div class="error-text" *ngIf="orderForm.get('paymentMethod')?.touched && orderForm.get('paymentMethod')?.invalid">
        <small>El método de pago es requerido.</small>
      </div>
    </ion-list>

    <div class="ion-margin-top">
      <ion-button type="submit" [disabled]="orderForm.invalid" expand="block">
        Confirmar pedido
      </ion-button>
    </div>
  </form>
</ion-content>
